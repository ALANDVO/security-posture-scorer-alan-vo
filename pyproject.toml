[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "security-posture-scorer-alan-vo"
version = "1.0.0"
description = "AI security posture scorer auditing codebases and configs with deterministic 0-100 scoring, fix prioritization, and benchmark evaluation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alan Vo", email = "alanvo@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.28.0",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "httpx==0.27.0",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "strict"
