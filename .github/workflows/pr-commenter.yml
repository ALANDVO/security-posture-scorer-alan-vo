name: PR Security Posture Commenter

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  post-pr-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: "."
          DATABASE_PATH: ":memory:"
          DEMO_MODE: "true"
          ENVIRONMENT: "development"
        run: |
          pytest backend/tests -v --tb=short

      - name: Generate and post PR security posture comment
        env:
          PYTHONPATH: "."
          DATABASE_PATH: ":memory:"
          DEMO_MODE: "true"
          ENVIRONMENT: "development"
        run: |
          # Run a quick scan to get current posture score
          PYTHONPATH=. python3 -c "
import subprocess
import sys
sys.path.insert(0, '.')
from backend.app.services.scanner import scanner
from backend.app.core.database import db
from backend.app.services.pr_commenter import generate_pr_comment

# For demo: get the latest two scans or create sample scan IDs
# In production, these would come from actual scan history
before_id = 'scan-prev'  # Would be from DB
after_id = 'scan-curr'   # Would be from DB

try:
    comment = generate_pr_comment(before_id, after_id)
    print(comment)
except Exception as e:
    print(f'## error generating comment: {e}')
    sys.exit(1)
" > pr-comment-body.txt

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('pr-comment-body.txt', 'utf8');
            const issueNumber = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: commentBody
            });
